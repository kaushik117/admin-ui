# ──────────────────────────────────────────────────────────────────────────────
# COMPONENTS
# ──────────────────────────────────────────────────────────────────────────────
components:

  # ── Parameters ─────────────────────────────────────────────────────────────
  parameters:
    sessionIdPath:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
      description: Unique identifier of the chat session

    assistantCodePath:
      name: assistantCode
      in: path
      required: true
      schema:
        type: string
      description: Unique code identifying the assistant (e.g. `loan-advisor`)

    kbIdPath:
      name: kbId
      in: path
      required: true
      schema:
        type: string
      description: Unique identifier of the knowledge base

    idPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: Numeric primary key of the resource

    pageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        default: 0
        minimum: 0
      description: Zero-based page number

    sizeParam:
      name: size
      in: query
      required: false
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 200
      description: Page size

  # ── Reusable Responses ─────────────────────────────────────────────────────
  responses:
    BadRequest:
      description: "400 — Validation failure or bad argument"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"

    Forbidden:
      description: "403 — Unauthorized runtime override"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"

    NotFound:
      description: "404 — Resource not found"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"

    UnprocessableEntity:
      description: "422 — Config invalid or policy violation"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"

    InternalServerError:
      description: "500 — Unexpected server error"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"

    BadGateway:
      description: "502 — Upstream LLM provider error"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"

    ServiceUnavailable:
      description: "503 — Target model unavailable"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"

    GatewayTimeout:
      description: "504 — Chat execution timed out"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"

  # ── Schemas ────────────────────────────────────────────────────────────────
  schemas:

    # ── Health ────────────────────────────────────────────────────────────────
    PingResponse:
      type: object
      description: Liveness probe response
      properties:
        status:
          type: string
          example: UP
        service:
          type: string
          example: generic-chatbot-platform
        timestamp:
          type: string
          format: date-time
          example: "2026-05-31T10:00:00Z"

    # ── Chat Request ──────────────────────────────────────────────────────────
    ChatRequest:
      type: object
      description: Payload for both blocking chat and streaming chat endpoints
      required:
        - assistantCode
        - tenantId
        - sessionId
        - userId
        - message
      properties:
        assistantCode:
          type: string
          maxLength: 100
          description: Identifier of the assistant to use (e.g. `loan-advisor`).
          example: loan-advisor
        tenantId:
          type: string
          maxLength: 100
          description: Tenant identifier for multi-tenancy scoping.
          example: rahi-prod
        sessionId:
          type: string
          maxLength: 100
          description: |
            Stable conversation session identifier. If the session does not exist
            it is created on first use.
          example: sess-abc123
        userId:
          type: string
          maxLength: 100
          description: Identifier of the end user initiating the message.
          example: user-xyz
        message:
          type: string
          maxLength: 20000
          description: The user's natural-language message / query.
          example: "What are the eligibility criteria for a home loan?"
        locale:
          type: string
          maxLength: 20
          description: BCP-47 locale tag for language preference (e.g. `en-IN`).
          example: en-IN
        channel:
          type: string
          maxLength: 50
          description: Originating channel (e.g. `web`, `mobile`, `whatsapp`).
          example: web
        context:
          type: object
          additionalProperties: true
          description: Arbitrary key-value context bag passed to the prompt variable resolver and tool chain.
          example:
            source: landing-page
            loanType: home
        runtimeOverride:
          $ref: "#/components/schemas/RuntimeOverride"

    RuntimeOverride:
      type: object
      description: |
        Optional per-request overrides applied on top of the assistant's stored configuration.
        Only present fields are applied; omitted fields retain their configured values.
      properties:
        knowledgeBaseId:
          type: string
          maxLength: 100
          description: Override the RAG knowledge base for this request.
          example: kb-home-loans
        memoryStoreType:
          $ref: "#/components/schemas/MemoryStoreType"
        enabledToolNames:
          type: array
          maxItems: 20
          description: Explicit allow-list of tool names to activate for this request.
          items:
            type: string
            maxLength: 100
          example: ["loan-eligibility-check", "rate-calculator"]
        modelHint:
          type: string
          maxLength: 100
          description: Hint to the model router to prefer a specific model identifier.
          example: gpt-4o
        streamingEnabled:
          type: boolean
          description: Override the assistant's default streaming setting for this request.
          example: false

    # ── Blocking Response ─────────────────────────────────────────────────────
    ChatResponse:
      type: object
      description: Complete assistant reply returned by the blocking chat endpoint
      properties:
        requestId:
          type: string
          description: Correlation ID for this request (matches MDC `requestId` in logs).
          example: req-7f3a9c12
        sessionId:
          type: string
          example: sess-abc123
        messageId:
          type: string
          description: Unique ID of the persisted assistant message.
          example: msg-88de01f4
        assistantCode:
          type: string
          example: loan-advisor
        content:
          type: string
          description: Full assistant reply text.
          example: "To be eligible for a home loan you must be at least 21 years old…"
        selectedProvider:
          type: string
          description: LLM provider selected by the router (e.g. `openai`, `anthropic`).
          example: openai
        selectedModel:
          type: string
          description: Model identifier used for the response.
          example: gpt-4o
        finishReason:
          type: string
          description: Model stop reason (e.g. `stop`, `length`, `tool_calls`, `content_filter`).
          example: stop
        timestamp:
          type: string
          format: date-time
          example: "2026-05-31T10:00:01Z"
        usage:
          $ref: "#/components/schemas/ResponseUsage"
        citations:
          type: array
          description: RAG citations supporting the response (empty when RAG was not used).
          items:
            $ref: "#/components/schemas/ResponseCitation"
        toolExecutions:
          type: array
          description: Summary of tools invoked during this request.
          items:
            $ref: "#/components/schemas/ToolExecutionSummary"
        metadata:
          $ref: "#/components/schemas/ResponseMetadata"

    ResponseUsage:
      type: object
      description: Token and latency accounting for a chat response
      properties:
        inputTokens:
          type: integer
          description: Number of tokens in the prompt sent to the model.
          example: 512
        outputTokens:
          type: integer
          description: Number of tokens generated by the model.
          example: 128
        latencyMs:
          type: integer
          format: int64
          description: End-to-end latency in milliseconds.
          example: 1240

    ResponseCitation:
      type: object
      description: A single RAG source citation referenced in the assistant reply
      properties:
        sourceId:
          type: string
          example: doc-00412
        sourceType:
          type: string
          description: Type of the source (e.g. `PDF`, `URL`, `DB_ROW`).
          example: PDF
        title:
          type: string
          example: "Home Loan Policy v3.2"
        snippet:
          type: string
          description: Relevant text excerpt from the source.
          example: "Applicants must be between 21 and 65 years of age…"
        location:
          type: string
          description: Page number, URL, or other location hint.
          example: "Page 12"

    ToolExecutionSummary:
      type: object
      description: Lightweight audit record for a single tool invocation
      properties:
        toolName:
          type: string
          example: loan-eligibility-check
        toolType:
          $ref: "#/components/schemas/ToolType"
        success:
          type: boolean
          example: true
        latencyMs:
          type: integer
          format: int64
          example: 320

    ResponseMetadata:
      type: object
      description: Execution metadata attached to a chat response
      properties:
        ragUsed:
          type: boolean
          example: true
        memoryUsed:
          type: boolean
          example: true
        toolsUsed:
          type: boolean
          example: false
        knowledgeBaseId:
          type: string
          description: Effective knowledge base ID used (after overrides).
          example: kb-home-loans
        promptVersion:
          type: string
          example: v2.1.0
        configVersion:
          type: string
          example: "42"
        streamed:
          type: boolean
          example: false

    # ── Streaming ─────────────────────────────────────────────────────────────
    StreamingChatChunk:
      type: object
      description: "A single SSE data payload for an incremental content fragment. SSE event name: `message`"
      properties:
        requestId:
          type: string
          example: req-7f3a9c12
        sessionId:
          type: string
          example: sess-abc123
        eventType:
          type: string
          description: Always `message` for content chunks.
          example: message
        contentChunk:
          type: string
          description: Incremental text fragment from the model.
          example: "To be eligible"
        sequenceNumber:
          type: integer
          description: Zero-based index of this chunk within the stream.
          example: 3
        timestamp:
          type: string
          format: date-time
          example: "2026-05-31T10:00:01.123Z"
        metadata:
          $ref: "#/components/schemas/StreamingMetadata"

    StreamingMetadata:
      type: object
      description: Provider and model information attached to streaming chunks
      properties:
        selectedModel:
          type: string
          example: gpt-4o
        selectedProvider:
          type: string
          example: openai
        partial:
          type: boolean
          description: "`true` for content chunks; `false` on the completion event."
          example: true
        finishReason:
          type: string
          description: Populated on the final chunk when the stream ends.
          nullable: true
          example: null

    StreamingCompletion:
      type: object
      description: "Final SSE event sent after all content chunks. SSE event name: `completion`"
      properties:
        requestId:
          type: string
          example: req-7f3a9c12
        sessionId:
          type: string
          example: sess-abc123
        messageId:
          type: string
          example: msg-88de01f4
        eventType:
          type: string
          description: Always `completion`.
          example: completion
        usage:
          $ref: "#/components/schemas/ResponseUsage"
        citations:
          type: array
          items:
            $ref: "#/components/schemas/ResponseCitation"
        toolExecutions:
          type: array
          items:
            $ref: "#/components/schemas/ToolExecutionSummary"
        timestamp:
          type: string
          format: date-time
          example: "2026-05-31T10:00:02Z"

    # ── Sessions ──────────────────────────────────────────────────────────────
    SessionSummary:
      type: object
      description: Metadata for a single chat session
      properties:
        sessionId:
          type: string
          example: sess-abc123
        tenantId:
          type: string
          example: rahi-prod
        assistantCode:
          type: string
          example: loan-advisor
        userId:
          type: string
          example: user-xyz
        title:
          type: string
          example: "Home loan eligibility enquiry"
        status:
          $ref: "#/components/schemas/SessionStatus"
        createdAt:
          type: string
          format: date-time
          example: "2026-05-30T09:00:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-05-31T10:00:00Z"
        lastMessageAt:
          type: string
          format: date-time
          example: "2026-05-31T10:00:01Z"
        locale:
          type: string
          example: en-IN
        channel:
          type: string
          example: web

    MessageDto:
      type: object
      description: A single persisted message within a session
      properties:
        messageId:
          type: string
          example: msg-001
        requestId:
          type: string
          example: req-7f3a9c12
        role:
          type: string
          description: "Message role. One of: `USER`, `ASSISTANT`, `SYSTEM`, `TOOL`."
          example: ASSISTANT
        content:
          type: string
          example: "To be eligible for a home loan you must be at least 21 years old…"
        selectedModel:
          type: string
          nullable: true
          example: gpt-4o
        finishReason:
          type: string
          nullable: true
          example: stop
        hasCitations:
          type: boolean
          example: true
        timestamp:
          type: string
          format: date-time
          example: "2026-05-31T10:00:01Z"

    SessionMessagesResponse:
      type: object
      description: Paginated list of messages in a session
      properties:
        sessionId:
          type: string
          example: sess-abc123
        messages:
          type: array
          items:
            $ref: "#/components/schemas/MessageDto"
        page:
          $ref: "#/components/schemas/PageMetadata"

    UserSessionsResponse:
      type: object
      description: Paginated list of sessions for a user
      properties:
        userId:
          type: string
          example: user-xyz
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/SessionSummary"
        page:
          $ref: "#/components/schemas/PageMetadata"

    PageMetadata:
      type: object
      description: Pagination envelope included on list responses
      properties:
        size:
          type: integer
          description: The requested page size (limit).
          example: 50
        count:
          type: integer
          description: The number of items actually returned.
          example: 12
        nextCursor:
          type: string
          nullable: true
          description: Opaque cursor for fetching the next page (null if no more pages).
          example: null

