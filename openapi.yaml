openapi: 3.0.3

info:
  title: k2pbot — Generic Chatbot Platform API
  description: |
    REST API for the k2pbot Generic Chatbot Platform built on Spring Boot / Spring AI.
    Provides blocking chat, Server-Sent Events streaming, session management, and admin
    configuration endpoints.

    **Error codes returned in `ApiErrorResponse.errorCode`**
    | Code | Meaning |
    |---|---|
    | `VALIDATION_ERROR` | Bean-validation failure on the request body |
    | `ASSISTANT_NOT_FOUND` | No active assistant found for the given code |
    | `CONFIG_INVALID` | Assistant config failed validation (422) |
    | `CONFIG_NOT_FOUND` | Config resolution / knowledge-base lookup failed |
    | `INVALID_REQUEST` | Unauthorised runtime override or bad argument |
    | `TOOL_NOT_ALLOWED` | Policy violation during tool execution (422) |
    | `STREAMING_NOT_SUPPORTED` | Assistant does not support streaming |
    | `MODEL_UNAVAILABLE` | Target LLM model is unavailable (503) |
    | `LLM_PROVIDER_ERROR` | Upstream LLM provider error (502) |
    | `INTERNAL_ERROR` | Unexpected server error or execution failure |
  version: "1.0.0"
  contact:
    email: kaushik117@gmail.com

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: Chat
    description: Blocking chat execution
  - name: Streaming
    description: Server-Sent Events streaming chat
  - name: Sessions
    description: Session and message retrieval
  - name: Admin
    description: Runtime config inspection and cache management
  - name: AdminAssistants
    description: Assistant CRUD and lifecycle management
  - name: AdminKnowledgeBases
    description: Knowledge base CRUD and lifecycle management
  - name: AdminPolicies
    description: Per-assistant policy management (memory, RAG, response, safety, tools)
  - name: AdminRoutes
    description: Model routing rule management
  - name: AdminPromptTemplates
    description: Prompt template management
  - name: AdminExecutions
    description: Execution audit record queries
  - name: AdminAudit
    description: Tool and RAG retrieval audit records
  - name: AdminSessions
    description: Admin session management
  - name: AdminStats
    description: Platform-level statistics
  - name: AdminTenantOverrides
    description: Tenant-specific config override management
  - name: Health
    description: Liveness / readiness probes

# ──────────────────────────────────────────────────────────────────────────────
# PATHS
# ──────────────────────────────────────────────────────────────────────────────
paths:

  # ── Health ─────────────────────────────────────────────────────────────────

  /api/v1/ping:
    get:
      tags: [Health]
      operationId: ping
      summary: Liveness probe
      description: Returns service name, status, and current server timestamp.
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PingResponse"
              example:
                status: UP
                service: generic-chatbot-platform
                timestamp: "2026-05-31T10:00:00Z"

  # ── Chat ───────────────────────────────────────────────────────────────────

  /api/v1/chat:
    post:
      tags: [Chat]
      operationId: chat
      summary: Blocking chat
      description: |
        Submit a user message and receive the complete assistant reply synchronously.
        The request must include a stable `sessionId`; if the session does not yet exist
        it will be created automatically.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
            example:
              assistantCode: loan-advisor
              tenantId: rahi-prod
              sessionId: sess-abc123
              userId: user-xyz
              message: "What are the eligibility criteria for a home loan?"
              locale: en-IN
              channel: web
              context:
                source: landing-page
              runtimeOverride:
                knowledgeBaseId: kb-home-loans
                modelHint: gpt-4o
                streamingEnabled: false
      responses:
        "200":
          description: Successful assistant reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"

  # ── Streaming ──────────────────────────────────────────────────────────────

  /api/v1/chat/stream:
    post:
      tags: [Streaming]
      operationId: streamChat
      summary: Streaming chat (Server-Sent Events)
      description: |
        Submit a user message and receive the assistant reply as a stream of
        Server-Sent Events.

        **Event types emitted on the SSE stream**
        | `eventType` | Payload schema | Description |
        |---|---|---|
        | `message` | `StreamingChatChunk` | Incremental content fragment |
        | `completion` | `StreamingCompletion` | Final event with usage, citations, and tool executions |
        | `error` | `ApiErrorResponse` | Stream-level error; connection will be closed |

        The SSE timeout is 60 seconds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: SSE stream — each event body is JSON
          content:
            text/event-stream:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/StreamingChatChunk"
                  - $ref: "#/components/schemas/StreamingCompletion"
                  - $ref: "#/components/schemas/ApiErrorResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ── Sessions ───────────────────────────────────────────────────────────────

  /api/v1/sessions/{sessionId}:
    get:
      tags: [Sessions]
      operationId: getSession
      summary: Get session summary
      description: Returns metadata for a single chat session by its ID.
      parameters:
        - $ref: "#/components/parameters/sessionIdPath"
      responses:
        "200":
          description: Session found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionSummary"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/sessions/{sessionId}/messages:
    get:
      tags: [Sessions]
      operationId: getSessionMessages
      summary: List messages in a session
      description: |
        Returns the most-recent messages in the session, ordered oldest-first.
        The `limit` query parameter controls how many messages are returned (default 50).
      parameters:
        - $ref: "#/components/parameters/sessionIdPath"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 500
          description: Maximum number of messages to return
      responses:
        "200":
          description: Message list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionMessagesResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/users/{userId}/sessions:
    get:
      tags: [Sessions]
      operationId: getUserSessions
      summary: List sessions for a user
      description: Returns all sessions for a user within a given tenant.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
          description: Identifier of the user
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
          description: Tenant scope for the query
      responses:
        "200":
          description: Session list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSessionsResponse"

  # ── Admin — Config (existing) ──────────────────────────────────────────────

  /api/v1/admin/assistants/{assistantCode}/config:
    get:
      tags: [Admin]
      operationId: getResolvedConfig
      summary: Get resolved assistant config
      description: |
        Returns the fully-resolved runtime configuration for an assistant (all policies
        merged, tenant overrides applied, cache populated). Useful for debugging and
        UI config introspection.
      parameters:
        - $ref: "#/components/parameters/assistantCodePath"
        - name: tenantId
          in: query
          required: false
          schema:
            type: string
            default: default
          description: Tenant to resolve overrides for
      responses:
        "200":
          description: Resolved config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolvedAssistantConfig"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/admin/assistants/{assistantCode}/config/cache:
    delete:
      tags: [Admin]
      operationId: evictAssistantCache
      summary: Evict config cache for an assistant
      description: Removes the cached resolved config for a single assistant / tenant combination.
      parameters:
        - $ref: "#/components/parameters/assistantCodePath"
        - name: tenantId
          in: query
          required: false
          schema:
            type: string
            default: default
      responses:
        "204":
          description: Cache entry evicted
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/config/cache:
    delete:
      tags: [Admin]
      operationId: evictAllCache
      summary: Evict entire config cache
      description: Clears all cached resolved configs (all assistants, all tenants).
      responses:
        "204":
          description: Cache cleared

  # ── Admin — Assistants ─────────────────────────────────────────────────────

  /api/v1/admin/assistants:
    get:
      tags: [AdminAssistants]
      operationId: listAssistants
      summary: List assistants
      description: Returns a paginated list of assistants, optionally filtered by active status or tenant scope.
      parameters:
        - name: active
          in: query
          required: false
          schema:
            type: boolean
          description: Filter by active status
        - name: tenantScope
          in: query
          required: false
          schema:
            type: string
          description: Filter by tenant scope
        - $ref: "#/components/parameters/pageParam"
        - $ref: "#/components/parameters/sizeParam"
      responses:
        "200":
          description: Assistant list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssistantSummary"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [AdminAssistants]
      operationId: createAssistant
      summary: Create assistant
      description: Creates a new assistant definition. The assistant is inactive until explicitly activated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAssistantRequest"
      responses:
        "201":
          description: Assistant created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantDto"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/admin/assistants/{assistantCode}:
    get:
      tags: [AdminAssistants]
      operationId: getAssistant
      summary: Get assistant
      description: Returns full details for a single assistant.
      parameters:
        - $ref: "#/components/parameters/assistantCodePath"
      responses:
        "200":
          description: Assistant found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantDto"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [AdminAssistants]
      operationId: updateAssistant
      summary: Update assistant
      description: Updates mutable fields on an existing assistant.
      parameters:
        - $ref: "#/components/parameters/assistantCodePath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAssistantRequest"
      responses:
        "200":
          description: Assistant updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantDto"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/assistants/{assistantCode}/activate:
    post:
      tags: [AdminAssistants]
      operationId: activateAssistant
      summary: Activate assistant
      description: Sets the assistant's active flag to true, making it available for chat requests.
      parameters:
        - $ref: "#/components/parameters/assistantCodePath"
      responses:
        "200":
          description: Assistant activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantDto"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/assistants/{assistantCode}/deactivate:
    post:
      tags: [AdminAssistants]
      operationId: deactivateAssistant
      summary: Deactivate assistant
      description: Sets the assistant's active flag to false, blocking new chat requests.
      parameters:
        - $ref: "#/components/parameters/assistantCodePath"
      responses:
        "200":
          description: Assistant deactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantDto"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Admin — Knowledge Bases ────────────────────────────────────────────────

  /api/v1/admin/knowledge-bases:
    get:
      tags: [AdminKnowledgeBases]
      operationId: listKnowledgeBases
      summary: List knowledge bases
      description: Returns all knowledge bases, optionally filtered by active status.
      parameters:
        - name: active
          in: query
          required: false
          schema:
            type: boolean
          description: Filter by active status
      responses:
        "200":
          description: Knowledge base list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KnowledgeBaseSummary"
    post:
      tags: [AdminKnowledgeBases]
      operationId: createKnowledgeBase
      summary: Create knowledge base
      description: Registers a new knowledge base definition.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateKnowledgeBaseRequest"
      responses:
        "201":
          description: Knowledge base created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeBaseDto"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/admin/knowledge-bases/{kbId}:
    get:
      tags: [AdminKnowledgeBases]
      operationId: getKnowledgeBase
      summary: Get knowledge base
      parameters:
        - $ref: "#/components/parameters/kbIdPath"
      responses:
        "200":
          description: Knowledge base found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeBaseDto"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [AdminKnowledgeBases]
      operationId: updateKnowledgeBase
      summary: Update knowledge base
      parameters:
        - $ref: "#/components/parameters/kbIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateKnowledgeBaseRequest"
      responses:
        "200":
          description: Knowledge base updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeBaseDto"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/knowledge-bases/{kbId}/activate:
    post:
      tags: [AdminKnowledgeBases]
      operationId: activateKnowledgeBase
      summary: Activate knowledge base
      parameters:
        - $ref: "#/components/parameters/kbIdPath"
      responses:
        "200":
          description: Knowledge base activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeBaseDto"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/knowledge-bases/{kbId}/deactivate:
    post:
      tags: [AdminKnowledgeBases]
      operationId: deactivateKnowledgeBase
      summary: Deactivate knowledge base
      parameters:
        - $ref: "#/components/parameters/kbIdPath"
      responses:
        "200":
          description: Knowledge base deactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeBaseDto"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Admin — Memory Policy ──────────────────────────────────────────────────

  /api/v1/admin/assistants/{assistantCode}/memory-policy:
    get:
      tags: [AdminPolicies]
      operationId: getMemoryPolicy
      summary: Get memory policy
      description: Returns the memory policy for an assistant.
      parameters:
        - $ref: "#/components/parameters/assistantCodePath"
      responses:
        "200":
          description: Memory policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryPolicyDto"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [AdminPolicies]
      operationId: upsertMemoryPolicy
      summary: Upsert memory policy
      description: Creates or replaces the memory policy for an assistant.
      parameters:
        - $ref: "#/components/parameters/assistantCodePath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertMemoryPolicyRequest"
      responses:
        "200":
          description: Memory policy saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryPolicyDto"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Admin — RAG Policy ─────────────────────────────────────────────────────

  /api/v1/admin/assistants/{assistantCode}/rag-policy:
    get:
      tags: [AdminPolicies]
      operationId: getRagPolicy
      summary: Get RAG policy
      description: Returns the RAG policy for an assistant.
      parameters:
        - $ref: "#/components/parameters/assistantCodePath"
      responses:
        "200":
          description: RAG policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RagPolicyDto"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [AdminPolicies]
      operationId: upsertRagPolicy
      summary: Upsert RAG policy
      description: Creates or replaces the RAG policy for an assistant.
      parameters:
        - $ref: "#/components/parameters/assistantCodePath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertRagPolicyRequest"
      responses:
        "200":
          description: RAG policy saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RagPolicyDto"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Admin — Response Policy ────────────────────────────────────────────────

  /api/v1/admin/assistants/{assistantCode}/response-policy:
    get:
      tags: [AdminPolicies]
      operationId: getResponsePolicy
      summary: Get response policy
      description: Returns the response/output formatting policy for an assistant.
      parameters:
        - $ref: "#/components/parameters/assistantCodePath"
      responses:
        "200":
          description: Response policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponsePolicyDto"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [AdminPolicies]
      operationId: upsertResponsePolicy
      summary: Upsert response policy
      description: Creates or replaces the response policy for an assistant.
      parameters:
        - $ref: "#/components/parameters/assistantCodePath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertResponsePolicyRequest"
      responses:
        "200":
          description: Response policy saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponsePolicyDto"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Admin — Safety Policy ──────────────────────────────────────────────────

  /api/v1/admin/assistants/{assistantCode}/safety-policy:
    get:
      tags: [AdminPolicies]
      operationId: getSafetyPolicy
      summary: Get safety policy
      description: Returns the content safety / guardrail policy for an assistant.
      parameters:
        - $ref: "#/components/parameters/assistantCodePath"
      responses:
        "200":
          description: Safety policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SafetyPolicyDto"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [AdminPolicies]
      operationId: upsertSafetyPolicy
      summary: Upsert safety policy
      description: Creates or replaces the safety policy for an assistant.
      parameters:
        - $ref: "#/components/parameters/assistantCodePath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertSafetyPolicyRequest"
      responses:
        "200":
          description: Safety policy saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SafetyPolicyDto"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Admin — Tool Policy ────────────────────────────────────────────────────

  /api/v1/admin/assistants/{assistantCode}/tools:
    get:
      tags: [AdminPolicies]
      operationId: listToolPolicies
      summary: List tool policies
      description: Returns all tool policy entries for an assistant, optionally filtered by enabled status.
      parameters:
        - $ref: "#/components/parameters/assistantCodePath"
        - name: enabled
          in: query
          required: false
          schema:
            type: boolean
          description: Filter by enabled status
      responses:
        "200":
          description: Tool policy list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ToolPolicyDto"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [AdminPolicies]
      operationId: createToolPolicy
      summary: Create tool policy
      description: Registers a new tool in the assistant's allow-list.
      parameters:
        - $ref: "#/components/parameters/assistantCodePath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateToolPolicyRequest"
      responses:
        "201":
          description: Tool policy created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolPolicyDto"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/assistants/{assistantCode}/tools/{id}:
    get:
      tags: [AdminPolicies]
      operationId: getToolPolicy
      summary: Get tool policy
      parameters:
        - $ref: "#/components/parameters/assistantCodePath"
        - $ref: "#/components/parameters/idPath"
      responses:
        "200":
          description: Tool policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolPolicyDto"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [AdminPolicies]
      operationId: updateToolPolicy
      summary: Update tool policy
      parameters:
        - $ref: "#/components/parameters/assistantCodePath"
        - $ref: "#/components/parameters/idPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateToolPolicyRequest"
      responses:
        "200":
          description: Tool policy updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolPolicyDto"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [AdminPolicies]
      operationId: deleteToolPolicy
      summary: Delete tool policy
      parameters:
        - $ref: "#/components/parameters/assistantCodePath"
        - $ref: "#/components/parameters/idPath"
      responses:
        "204":
          description: Tool policy deleted
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Admin — Model Routes ───────────────────────────────────────────────────

  /api/v1/admin/assistants/{assistantCode}/routes:
    get:
      tags: [AdminRoutes]
      operationId: listModelRoutes
      summary: List model routes
      description: Returns all model routing rules for an assistant.
      parameters:
        - $ref: "#/components/parameters/assistantCodePath"
        - name: activeOnly
          in: query
          required: false
          schema:
            type: boolean
          description: When true, return only active routes
      responses:
        "200":
          description: Route list
          content:
            application/json:
              schema:
                type: array
                items:
