    # ── Error ─────────────────────────────────────────────────────────────────
    ApiErrorResponse:
      type: object
      description: Standardised error envelope returned for all error responses
      properties:
        errorCode:
          type: string
          description: Machine-readable error code (see API description for full list).
          example: VALIDATION_ERROR
        errorMessage:
          type: string
          description: Human-readable description of the error.
          example: "Request validation failed"
        requestId:
          type: string
          description: Correlation ID from MDC — include in support tickets.
          example: req-7f3a9c12
        timestamp:
          type: string
          format: date-time
          example: "2026-05-31T10:00:00Z"
        fieldErrors:
          type: array
          description: Per-field validation errors (only present on 400 VALIDATION_ERROR).
          items:
            $ref: "#/components/schemas/FieldValidationError"

    FieldValidationError:
      type: object
      description: A single field-level validation failure
      properties:
        field:
          type: string
          description: The request body field path that failed validation.
          example: message
        message:
          type: string
          description: Validation constraint message.
          example: "must not be blank"

    # ── Enumerations ──────────────────────────────────────────────────────────
    MemoryStoreType:
      type: string
      description: |
        Conversation memory storage backend.
        - `NONE` — memory disabled
        - `IN_MEMORY` — volatile in-process storage (lost on restart)
        - `JDBC` — durable storage in the relational database
      enum:
        - NONE
        - IN_MEMORY
        - JDBC
      example: JDBC

    SessionStatus:
      type: string
      description: Lifecycle status of a chat session
      enum:
        - ACTIVE
        - CLOSED
        - EXPIRED
      example: ACTIVE

    RouteType:
      type: string
      description: Classification of a model routing rule
      enum:
        - SIMPLE
        - KNOWLEDGE_QA
        - TOOL_HEAVY
        - LONG_CONTEXT
        - STRUCTURED_OUTPUT
      example: KNOWLEDGE_QA

    ToolType:
      type: string
      description: |
        Execution mechanism for a tool.
        - `LOCAL_BEAN` — Spring bean invoked in-process
        - `REST` — outbound HTTP call
        - `MCP` — Model Context Protocol tool
      enum:
        - LOCAL_BEAN
        - REST
        - MCP
      example: LOCAL_BEAN

    FallbackPolicy:
      type: string
      description: |
        What to do when no routing rule matches.
        - `USE_DEFAULT_MODEL` — fall back to the configured default model
        - `FAIL_FAST` — return an error immediately
      enum:
        - USE_DEFAULT_MODEL
        - FAIL_FAST
      example: USE_DEFAULT_MODEL
